version: "2"

run:
  go: "1.22"
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - revive
    - testifylint
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    revive:
      enable-default-rules: true
      rules:
        - name: exported
  exclusions:
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
